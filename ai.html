<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>RatnaGPT</title><style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0f0f0f;color:#fff;font-family:system-ui;display:flex;height:100dvh;overflow:hidden}
.sidebar{width:260px;background:#171717;padding:12px;display:flex;flex-direction:column;gap:10px;border-right:1px solid #222}
@media(max-width:768px){.sidebar{display:none}}
.new{background:#fff;color:#000;border-radius:10px;padding:12px;text-align:center;font-weight:600;cursor:pointer}
.main{flex:1;display:flex;flex-direction:column}
.top{padding:12px 16px;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center}
.center{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;align-items:center}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:600px;width:100%;margin-top:20px}
.card{border:1px solid #2a2a2a;padding:12px;border-radius:12px;background:#1a1a1a;cursor:pointer;font-size:13px}
.inputArea{padding:12px 16px 20px;background:#0f0f0f;border-top:1px solid #222;display:flex;gap:10px;align-items:center}
.inputArea input{flex:1;background:#2a2a2a;border:none;border-radius:24px;padding:14px 18px;color:#fff;outline:none;font-size:15px}
.inputArea button{background:#fff;color:#000;border:none;width:40px;height:40px;border-radius:50%;cursor:pointer}
.msg{max-width:700px;width:100%;padding:12px 0;font-size:14px;line-height:1.6;white-space:pre-wrap}
.user{font-weight:600;color:#fff}
.ai{color:#ccc}
</style></head><body>
<div class="sidebar"><div class="new" onclick="location.reload()">+ New Chat</div></div>
<div class="main">
<div class="top"><div>🧠 <b>RatnaGPT - Real AI</b></div><div><a href="/" style="color:#888;text-decoration:none;font-size:13px;">Home</a></div></div>
<div class="center" id="chat"><h2>Em adagali ra? 😊</h2><p style="color:#888;font-size:13px;margin:8px 0 20px;">Real AI Connected!</p>
<div class="cards" id="cards">
<div class="card" onclick="ask(this)">📹 AR Connect ela work avutundi?</div>
<div class="card" onclick="ask(this)">💻 ChatGPT app ela create chesaru?</div>
<div class="card" onclick="ask(this)">🤖 Hacking anty enti bro?</div>
<div class="card" onclick="ask(this)">🧠 Nee peru enti?</div>
</div></div>
<div class="inputArea"><input id="q" placeholder="Emaina adugu..." autocomplete="off" onkeydown="if(event.key==='Enter')send()"><button onclick="send()">↑</button></div>
</div>
<script>
const chat=document.getElementById('chat');const input=document.getElementById('q');
function addMsg(t,c){const cards=document.getElementById('cards');if(cards)cards.style.display='none';const d=document.createElement('div');d.className='msg '+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;chat.parentElement.scrollTop=chat.parentElement.scrollHeight;}
function ask(el){sendText(el.innerText)}
function send(){const v=input.value.trim();if(!v)return;sendText(v)}
async function sendText(text){
  addMsg('🧑‍💻 '+text,'user');input.value='';addMsg('🤖 Typing...','ai');
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
    const data=await res.json();
    document.querySelectorAll('.msg').forEach(m=>{if(m.textContent.includes('Typing'))m.remove()});
    addMsg('🤖 '+data.reply,'ai');
  }catch(e){
    document.querySelectorAll('.msg').forEach(m=>{if(m.textContent.includes('Typing'))m.remove()});
    addMsg('🤖 Error ra: API key set chesava? Render lo GEMINI_KEY pettali!','ai');
  }
}
</script></body></html>
