<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>RatnaGPT - AR Connect AI</title><style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0f0f0f;color:#fff;font-family:system-ui;display:flex;height:100vh}
.sidebar{width:260px;background:#171717;padding:12px;display:flex;flex-direction:column;gap:10px;border-right:1px solid #222}
.new{background:#fff;color:#000;border-radius:10px;padding:12px;text-align:center;font-weight:600;cursor:pointer}
.main{flex:1;display:flex;flex-direction:column}.top{padding:14px;border-bottom:1px solid #222;display:flex;justify-content:space-between}
.msgs{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.msg{max-width:750px;margin:0 auto;width:100%;display:flex;gap:12px;padding:12px}.msg.user{background:#1a1a1a;border-radius:12px}
.avatar{width:32px;height:32px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center}
.text{line-height:1.6;font-size:15px;white-space:pre-wrap}
.input-area{padding:16px;border-top:1px solid #222;display:flex;justify-content:center}
.input-box{max-width:750px;width:100%;background:#1a1a1a;border-radius:24px;display:flex;padding:8px 8px 8px 20px;gap:8px;border:1px solid #333}
.input-box input{flex:1;background:transparent;border:none;color:#fff;outline:none;font-size:15px}
.send{width:36px;height:36px;background:#fff;border-radius:50%;border:none;cursor:pointer}
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;color:#888;text-align:center}
.welcome h1{font-size:28px;color:#fff}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:600px;width:100%}
.card{border:1px solid #222;padding:14px;border-radius:12px;cursor:pointer;text-align:left}.card:hover{background:#1a1a1a}
@media(max-width:700px){.sidebar{display:none}.cards{grid-template-columns:1fr}}
</style></head><body>
<div class="sidebar"><div class="new" onclick="location.reload()">+ New Chat</div><div style="margin-top:auto;color:#555;font-size:12px">RatnaGPT v1.0<br>AR Connect AI</div></div>
<div class="main"><div class="top"><div>🧠 RatnaGPT</div><div style="font-size:12px;color:#888"><a href="/" style="color:#888">Home</a> | <a href="/meeting.html" style="color:#888">Meeting</a></div></div><div id="msgs" class="msgs"><div class="welcome" id="welcome"><h1>Em adagali ra? 😊</h1><p>ChatGPT lanti AI - Ar Connect lo!</p><div class="cards"><div class="card" onclick="ask('AR Connect ela work avutundi?')">📹 AR Connect ela work avutundi?</div><div class="card" onclick="ask('ChatGPT lanti app ela create chesaru?')">💻 ChatGPT app ela create chesaru?</div><div class="card" onclick="ask('Video call lo iddaru yela kanipistaru?')">👥 Video lo iddaru yela?</div><div class="card" onclick="ask('Nee peru enti?')">🤖 Nee peru enti?</div></div></div></div><div class="input-area"><div class="input-box"><input id="inp" placeholder="Message RatnaGPT..." onkeydown="if(event.key==='Enter')send()"><button class="send" onclick="send()">↑</button></div></div></div>
<script>
const msgsEl=document.getElementById('msgs'),inp=document.getElementById('inp');
function ask(t){inp.value=t;send()}
function addMsg(role,text){const d=document.createElement('div');d.className='msg '+(role==='user'?'user':'');d.innerHTML=`<div class="avatar">${role==='user'?'R':'🤖'}</div><div class="text">${text}</div>`;const w=document.getElementById('welcome');if(w)w.remove();msgsEl.appendChild(d);msgsEl.scrollTop=msgsEl.scrollHeight}
async function send(){let q=inp.value.trim();if(!q)return;addMsg('user',q);inp.value='';let aiDiv=document.createElement('div');aiDiv.className='msg';aiDiv.innerHTML='<div class="avatar">🤖</div><div class="text">Typing...</div>';msgsEl.appendChild(aiDiv);msgsEl.scrollTop=msgsEl.scrollHeight;let ans=await getAI(q);aiDiv.querySelector('.text').innerText=ans;msgsEl.scrollTop=msgsEl.scrollHeight}
async function getAI(q){
 const ql=q.toLowerCase();
 if(ql.includes('ar connect'))return 'AR Connect lo video call PeerJS + Socket.IO tho work avutundi ra!\n\n1. Socket.IO = room join, user list\n2. PeerJS = P2P video connection\n3. register-peer event tho iddaru connect avutaru\n4. existing-peers tho auto call\n\nNee server.js lo ade logic undi - rooms[] lo users store chesi peer IDs exchange chestundi!';
 if(ql.includes('peru'))return 'Nenu RatnaGPT ra! 😎\nNee AR Connect project kosam nene create ayina AI clone! ChatGPT laane work chestha!';
 if(ql.includes('video')||ql.includes('iddaru'))return 'Video call lo iddaru kanipinchali ante:\n\n1. getUserMedia() tho camera on\n2. peer.call(peerId, stream) tho call\n3. peer.on(call) tho answer cheyali\n4. call.on(stream) tho remote video set cheyali\n\nNee meeting.html lo socket.on(existing-peers) daggara automatic call chestundi!';
 if(ql.includes('chatgpt')||ql.includes('create'))return 'ChatGPT lanti app ni 4 steps lo create chesaru:\n\n1. BRAIN: GPT model (Transformer) - trillions words tho train\n2. BACKEND: Python + PyTorch + GPU servers (Azure)\n3. FRONTEND: React.js - chat UI (manam ippudu chesindi ide!)\n4. API: /v1/chat/completions - user msg -> AI response\n\nNuvvu kuda OpenAI API key tho same app cheyavachu!';
 try{const r=await fetch('https://api.pollinations.ai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'openai',messages:[{role:'user',content:q}],max_tokens:600})});const d=await r.json();return d.choices?.[0]?.message?.content||'Ardham kaledu ra, malla adugu!';}catch(e){return 'Nenu RatnaGPT ra! Neeku AR Connect, video calls, coding anni nerpistha! 😊';}
}
</script></body></html>
