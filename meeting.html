<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>AR FIXED</title><script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script><style>body{background:#000;color:#fff;font-family:system-ui;margin:0}.top{display:flex;justify-content:space-between;padding:8px;background:#111}.pill{background:#222;border-radius:20px;padding:6px 10px;font-size:12px}.videos{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}.vid{position:relative;background:#111;border-radius:14px;overflow:hidden;aspect-ratio:4/3;border:2px solid #222}.vid video{width:100%;height:100%;object-fit:cover}.vid.live{border-color:#22c55e}.label{position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,.8);padding:3px 8px;border-radius:6px;font-size:11px}#log{font-size:11px;color:#4ade80;background:#111;padding:6px;margin:8px;border-radius:6px}.trans{margin:8px;background:#0a1930;border-radius:14px;padding:10px}.trans button{width:100%;padding:12px;border-radius:10px;border:0;margin:4px 0;color:#fff}</style></head><body><div class="top"><div class="pill">Participants <span id="pCount">1</span></div><div class="pill">RATNA999</div><div class="pill" id="status">Connecting...</div></div><div class="videos"><div class="vid"><video id="myVideo" autoplay muted playsinline></video><div class="label">You</div></div><div class="vid" id="rvBox"><video id="rv" autoplay muted playsinline></video><div class="label" id="rLabel">Friend - Waiting</div></div></div><div id="log">Init...</div><div class="trans"><button onclick="share()" style="background:#16a34a;font-weight:700">COPY LINK FOR FRIEND</button><button onclick="forcePlay()" style="background:#334155">FORCE PLAY - CLICK IF FRIEND BLACK</button></div><script>const ROOM='RATNA999';const myVideo=document.getElementById('myVideo');const rv=document.getElementById('rv');const logEl=document.getElementById('log');let localStream,peer,myId,facing='user';function log(t){logEl.innerText=t;console.log(t);}const hostId=new URLSearchParams(location.search).get('host');async function getCam(){try{if(localStream)localStream.getTracks().forEach(t=>t.stop());localStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:true});myVideo.srcObject=localStream;await myVideo.play();log('Cam ready');}catch(e){log('Cam err '+e.message);}}async function init(){await getCam();myId='ratna-'+ROOM+'-'+Math.floor(Math.random()*90000+10000);peer=new Peer(myId);peer.on('open',id=>{document.getElementById('status').innerText='Connected '+id.slice(-5);log('Ready '+(hostId?'Calling ':'HOST'));if(hostId&&hostId!==id)setTimeout(()=>callPeer(hostId),1000);});peer.on('call',c=>{log('Incoming call');c.answer(localStream);c.on('stream',s=>{showFriend(s);});});}function showFriend(s){log('Stream V='+s.getVideoTracks().length);rv.muted=true;rv.srcObject=s;setTimeout(async()=>{try{await rv.play();document.getElementById('rvBox').classList.add('live');document.getElementById('rLabel').innerText='Friend - LIVE';document.getElementById('pCount').innerText='2';document.getElementById('status').innerText='2 Connected';log('FRIEND VIDEO PLAYING!');}catch(e){log('Click FORCE PLAY');}},1500);}function callPeer(pid){log('Calling '+pid.slice(-5));let call=peer.call(pid,localStream);call.on('stream',s=>{showFriend(s);});}function forcePlay(){rv.muted=true;rv.play().then(()=>{document.getElementById('rvBox').classList.add('live');document.getElementById('rLabel').innerText='Friend - LIVE';document.getElementById('pCount').innerText='2';log('FORCE PLAY OK!');});}function share(){let link=location.origin+location.pathname+'?room='+ROOM+'&host='+myId;navigator.clipboard.writeText(link);alert('LINK COPIED '+link);}init();</script></body></html>
