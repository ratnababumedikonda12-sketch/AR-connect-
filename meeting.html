<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AR v2.1</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:system-ui;height:100vh;display:flex;flex-direction:column}
.top{height:40px;background:#111a2e;display:flex;justify-content:space-between;align-items:center;padding:0 10px;font-size:12px;border-bottom:1px solid #1e3a5f}
.top span{background:#0a84ff33;padding:2px 8px;border-radius:10px;margin-left:4px}
#videos{flex:1;position:relative;background:#000}
video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;background:#000}
#pip{width:90px;height:120px;right:10px;bottom:60px;left:auto;top:auto;border:2px solid #0a84ff;border-radius:10px;z-index:5}
#cap{position:absolute;bottom:8px;left:8px;right:110px;background:#000a;padding:6px 8px;border-radius:8px;font-size:11px;z-index:6;border:1px solid #0a84ff44}
.ctrl{height:56px;background:#111a2e;display:flex;justify-content:center;align-items:center;gap:14px}
.b{width:44px;height:44px;border-radius:50%;border:0;font-size:18px}.r{background:#ff3b30;color:#fff}.m{background:#1e3a5f;color:#fff}
</style></head><body>
<div class="top"><div>🅰️ AR Connect <span id="r">RATNA99</span> <span>5G Secured</span> <span>🤖 AI Active</span></div><div id="c">1 user</div></div>
<div id="videos">
<video id="localFull" autoplay muted playsinline></video>
<video id="remote" autoplay playsinline style="display:none"></video>
<video id="pip" autoplay muted playsinline></video>
<div id="cap">LIVE CAPTIONS Telugu→English<br>అందరికీ నమస్కారం<br><span style="color:#5eb0ff">Hello everyone</span></div>
</div>
<div class="ctrl"><button class="b m" onclick="toggleM()">🎤</button><button class="b m" onclick="toggleC()">📹</button><button class="b r" onclick="location.href='/'">📞</button></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const room=new URLSearchParams(location.search).get('room')||'RATNA99';
document.getElementById('r').innerText=room;
let ls,pc;
const sock=io();
const ice={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'}]};
(async()=>{
try{
ls=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
localFull.srcObject=ls;pip.srcObject=ls;
console.log('camera ok');
}catch(e){alert('Camera Allow chey! Chrome permission lo camera ON chey: '+e.message);return;}
sock.emit('join-room',room);
sock.on('user-joined',async()=>{
pc=new RTCPeerConnection(ice);
ls.getTracks().forEach(t=>pc.addTrack(t,ls));
pc.onicecandidate=e=>e.candidate&&sock.emit('ice-candidate',{roomId:room,candidate:e.candidate});
const o=await pc.createOffer();await pc.setLocalDescription(o);sock.emit('offer',{roomId:room,offer:o});
});
sock.on('offer',async({offer})=>{
pc=new RTCPeerConnection(ice);
ls.getTracks().forEach(t=>pc.addTrack(t,ls));
pc.onicecandidate=e=>e.candidate&&sock.emit('ice-candidate',{roomId:room,candidate:e.candidate});
pc.ontrack=e=>{remote.style.display='block';remote.srcObject=e.streams[0];localFull.style.display='none';};
await pc.setRemoteDescription(offer);
const a=await pc.createAnswer();await pc.setLocalDescription(a);sock.emit('answer',{roomId:room,answer:a});
});
sock.on('answer',async({answer})=>{await pc.setRemoteDescription(answer);});
sock.on('ice-candidate',c=>pc&&pc.addIceCandidate(c));
sock.on('user-count',n=>document.getElementById('c').innerText=n+' user');
})();
function toggleM(){const t=ls.getAudioTracks()[0];t.enabled=!t.enabled}
function toggleC(){const t=ls.getVideoTracks()[0];t.enabled=!t.enabled}
</script></body></html>
