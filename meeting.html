<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AR Connect Meet</title>
<style>
body{margin:0;background:#222;color:#fff;font-family:Arial;overflow:hidden}
#top{position:fixed;top:0;left:0;right:0;background:#0a84ff;padding:8px 12px;display:flex;justify-content:space-between;z-index:20;font-size:13px}
#main{width:100vw;height:100vh;object-fit:contain;background:#000;display:block}
#local{position:fixed;bottom:85px;right:8px;width:105px;height:140px;border-radius:10px;border:2px solid #fff;object-fit:cover;z-index:15;transform:scaleX(-1);background:#333}
#status{position:fixed;top:44px;left:50%;transform:translateX(-50%);background:#000000cc;padding:5px 12px;border-radius:12px;font-size:11px;z-index:20}
#controls{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#ffffffee;padding:6px 12px;border-radius:30px;display:flex;gap:8px;z-index:30;box-shadow:0 2px 10px #00000088}
#controls button{width:40px;height:40px;border-radius:50%;border:none;font-size:18px;background:#222;color:#fff}
#controls button.end{background:#ff3b30}
</style></head><body>
<div id="top"><div>🚀 RATNA99 | <span id="cnt">1</span> user</div><div><button onclick="navigator.clipboard.writeText(location.href);alert('Link copied!')" style="background:#fff;border:none;color:#0a84ff;padding:4px 10px;border-radius:6px;font-weight:bold">Copy</button> <button onclick="location.href='/'" style="background:#ff3b30;border:none;color:#fff;padding:4px 8px;border-radius:6px">Leave</button></div></div>
<div id="status">Starting camera...</div>
<video id="main" autoplay playsinline muted></video>
<video id="local" autoplay playsinline muted></video>
<div id="controls"><button id="mic">🎤</button><button id="cam">📹</button><button id="flip">🔄</button><button id="screen">🖥️</button><button id="chatBtn">💬</button><button onclick="location.href='/'" class="end">📞</button></div>
<script src="https://ar-connect.onrender.com/socket.io/socket.io.js"></script><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
let socket,peer,localStream,roomId=new URLSearchParams(location.search).get('room')||'RATNA99',remoteS=null,facing='user',peerId=null;
document.getElementById('cnt').textContent='1';
let mainV=document.getElementById('main'),localV=document.getElementById('local');
let setS=t=>document.getElementById('status').textContent=t;
socket=io("https://ar-connect.onrender.com",{transports:["websocket","polling"]});
async function startCam(mode){
 try{
  if(localStream){localStream.getTracks().forEach(t=>t.stop());}
  // SIMPLE CAMERA - no HD - works on all phones
  localStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:mode},audio:true});
  localV.srcObject=localStream;
  await localV.play().catch(()=>{});
  if(!remoteS){
   mainV.srcObject=localStream;
   await mainV.play().catch(()=>{});
  }
  setS("✅ Camera ON - "+mode+" - RATNA99");
 }catch(e){
  setS("❌ Camera error: "+e.message+" - allow permission");
  alert("Camera permission ivvu bro: "+e.message);
 }
}
startCam('user');
peer=new Peer({config:{iceServers:[{urls:"stun:stun.l.google.com:19302"}]}});
peer.on('open',id=>{peerId=id;socket.emit("join-room",{meetingId:roomId,userId:id});socket.emit("register-peer",{meetingId:roomId,peerId:id});});
peer.on('call',call=>{
 call.answer(localStream);
 call.on('stream',s=>{remoteS=s;mainV.srcObject=s;mainV.play();setS("✅ 2 users - Meet options OK");document.getElementById('cnt').textContent='2';});
});
socket.on('room-users',c=>document.getElementById('cnt').textContent=c);
socket.on('existing-peers',ids=>ids.forEach(id=>{if(id!==peerId)setTimeout(()=>callPeer(id),800);}));
socket.on('new-peer',d=>{if(d.peerId!==peerId)setTimeout(()=>callPeer(d.peerId),800);});
function callPeer(pid){
 try{
  let call=peer.call(pid,localStream);
  call.on('stream',s=>{remoteS=s;mainV.srcObject=s;mainV.play();setS("✅ Friend connected - Clear now");document.getElementById('cnt').textContent='2';});
  call.on('error',e=>setS("Call error"));
 }catch(e){setS("Call fail "+e.message);}
}
document.getElementById('mic').onclick=function(){let t=localStream.getAudioTracks()[0];if(t){t.enabled=!t.enabled;this.style.background=t.enabled?"#222":"#ff3b30";setS(t.enabled?"Mic ON":"Mic OFF");}};
document.getElementById('cam').onclick=function(){let t=localStream.getVideoTracks()[0];if(t){t.enabled=!t.enabled;this.style.background=t.enabled?"#222":"#ff3b30";setS(t.enabled?"Cam ON":"Cam OFF");}};
document.getElementById('flip').onclick=async()=>{facing=facing==='user'?'environment':'user';setS("Flipping...");await startCam(facing);};
document.getElementById('screen').onclick=async()=>{try{let scr=await navigator.mediaDevices.getDisplayMedia({video:true});mainV.srcObject=scr;await mainV.play();scr.getVideoTracks()[0].onended=()=>{mainV.srcObject=remoteS||localStream;};setS("Screen sharing");}catch(e){setS("Screen cancel");}};
document.getElementById('chatBtn').onclick=()=>{let m=prompt("Message:");if(m)socket.emit('chat-message',{meetingId:roomId,msg:m});};
mainV.onclick=()=>{if(remoteS){let isLocal=mainV.srcObject===localStream;mainV.srcObject=isLocal?remoteS:localStream;mainV.play();}};
socket.on('chat-message',d=>{alert(d.user+": "+d.msg);});
</script></body></html>
