<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AR Meet</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;overflow:hidden}
#top{position:fixed;top:0;left:0;right:0;background:#0a84ff;padding:10px 12px;display:flex;justify-content:space-between;z-index:20;font-size:13px;font-weight:bold}
#main{width:100vw;height:100vh;object-fit:cover;background:#111;display:block}
#local{position:fixed;bottom:90px;right:10px;width:120px;height:160px;border-radius:12px;border:2px solid #0a84ff;object-fit:cover;z-index:15;transform:scaleX(-1);background:#222}
#status{position:fixed;top:50px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.9);padding:6px 14px;border-radius:12px;font-size:11px;z-index:20}
#controls{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#ffffffee;padding:8px 12px;border-radius:35px;display:flex;gap:8px;z-index:30}
#controls button{width:42px;height:42px;border-radius:50%;border:none;font-size:18px;background:#222;color:#fff}
#controls .end{background:#ff3b30}
#center{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:30;background:#222;padding:24px;border-radius:18px;text-align:center;width:80%;max-width:300px;border:2px solid #0a84ff}
#center button{background:#0a84ff;color:#fff;border:none;padding:14px 20px;border-radius:12px;font-size:16px;font-weight:bold;width:100%;margin-top:12px}
</style><link rel="manifest" href="manifest.json"><link rel="icon" href="logo.png"><meta name="theme-color" content="#0a84ff"></head><body>
<div id="top"><div>🚀 RATNA99 | <span id="cnt">1</span> 👥</div><div><button onclick="navigator.clipboard.writeText(location.href);alert('Copied')" style="background:#fff;border:none;color:#0a84ff;padding:5px 10px;border-radius:8px">Copy</button> <button onclick="location.href='/'" style="background:#ff3b30;border:none;color:#fff;padding:5px 8px;border-radius:8px">Leave</button></div></div>
<div id="status">Tap START</div>
<div id="center"><h3 style="margin:0">📹 AR Connect</h3><p style="color:#aaa;font-size:13px">Camera permission ivvali</p><button onclick="startAll()">▶️ START CAMERA</button></div>
<video id="main" autoplay playsinline muted></video>
<video id="local" autoplay playsinline muted></video>
<div id="controls"><button id="mic">🎤</button><button id="cam">📹</button><button id="flip">🔄</button><button onclick="location.href='/'" class="end">📞</button></div>
<script src="https://ar-connect.onrender.com/socket.io/socket.io.js"></script><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
let socket,peer,localStream,roomId=new URLSearchParams(location.search).get('room')||'RATNA99',remoteS=null,peerId=null,facing='user';
let mainV=document.getElementById('main'),localV=document.getElementById('local');
let setS=t=>document.getElementById('status').textContent=t;
async function startAll(){
 document.getElementById('center').style.display='none';
 setS("Starting...");
 try{
  localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
  localV.srcObject=localStream;mainV.srcObject=localStream;
  await localV.play();await mainV.play();
  setS("✅ You ready - waiting friend");
  initPeer();
 }catch(e){setS("Camera error: "+e.message);document.getElementById('center').style.display='block';alert(e.message);}
}
function initPeer(){
 let ice=[{urls:"stun:stun.l.google.com:19302"},{urls:"turn:openrelay.metered.ca:80",username:"openrelayproject",credential:"openrelayproject"}];
 socket=io("https://ar-connect.onrender.com",{transports:["websocket","polling"]});
 peer=new Peer({config:{iceServers:ice}});
 peer.on('open',id=>{peerId=id;socket.emit("join-room",{meetingId:roomId,userId:id});socket.emit("register-peer",{meetingId:roomId,peerId:id});setS("✅ Connected - share link");});
 peer.on('call',call=>{call.answer(localStream);call.on('stream',s=>{remoteS=s;mainV.srcObject=s;mainV.play();setS("✅ FRIEND LIVE!");document.getElementById('cnt').textContent='2';});});
 socket.on('room-users',c=>document.getElementById('cnt').textContent=c);
 socket.on('existing-peers',ids=>ids.forEach(id=>{if(id!==peerId)setTimeout(()=>callPeer(id),800);}));
 socket.on('new-peer',d=>{if(d.peerId!==peerId)setTimeout(()=>callPeer(d.peerId),800);});
}
function callPeer(pid){if(!localStream)return;let call=peer.call(pid,localStream);call.on('stream',s=>{remoteS=s;mainV.srcObject=s;mainV.play();setS("✅ FRIEND LIVE!");document.getElementById('cnt').textContent='2';});}
document.getElementById('mic').onclick=function(){let t=localStream.getAudioTracks()[0];t.enabled=!t.enabled;this.style.background=t.enabled?"#222":"#ff3b30";};
document.getElementById('cam').onclick=function(){let t=localStream.getVideoTracks()[0];t.enabled=!t.enabled;this.style.background=t.enabled?"#222":"#ff3b30";};
document.getElementById('flip').onclick=async()=>{if(!localStream)return;facing=facing==='user'?'environment':'user';localStream.getTracks().forEach(x=>x.stop());localStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:true});localV.srcObject=localStream;if(!remoteS)mainV.srcObject=localStream;localV.play();mainV.play();};
</script></body></html>
