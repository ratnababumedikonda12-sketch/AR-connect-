<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AR Connect - Meeting</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:system-ui;min-height:100vh}
.top{display:flex;justify-content:space-between;padding:10px}
.pill{background:#111;border-radius:20px;padding:6px 12px;font-size:13px}
.videos{display:grid;grid-template-columns:1fr;gap:10px;padding:10px}
@media(min-width:600px){.videos{grid-template-columns:1fr 1fr}}
.vid{position:relative;background:#111;border-radius:16px;overflow:hidden;aspect-ratio:16/9}
.vid video{width:100%;height:100%;object-fit:cover}
.label{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,0.7);padding:4px 8px;border-radius:8px;font-size:12px}
.trans{margin:10px;background:#0a1930;border:1px solid #123;padding:12px;border-radius:16px}
.trans select{width:100%;padding:10px;border-radius:10px;background:#111;color:#fff;border:1px solid #333;margin:6px 0}
.trans button{width:100%;padding:12px;border-radius:10px;border:0;background:#1a2f5a;color:#fff;margin:6px 0;font-weight:600}
.controls{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:8px;background:#111;padding:10px 16px;border-radius:30px}
.controls button{width:44px;height:44px;border-radius:50%;border:0;background:#222;color:#fff;font-size:18px}
.controls .end{background:#e11}
#status{font-size:12px;color:#5af;padding:6px}
</style>
</head>
<body>
<div class="top">
<div class="pill">👥 Participants: <span id="pCount">1</span></div>
<div class="pill">🌐 <span id="roomShow"></span></div>
<div class="pill" style="background:#0a2a12;color:#5f5">✅ AR Connect connected</div>
</div>

<div class="videos">
<div class="vid"><video id="myVideo" autoplay muted playsinline></video><div class="label">You</div></div>
<div class="vid"><video id="remoteVideo" autoplay playsinline></video><div class="label" id="remoteLabel">Waiting for friend...</div></div>
</div>

<div class="trans">
<div style="font-weight:700;margin-bottom:6px">🎙️ Voice Translation</div>
<select id="fromLang"><option value="te-IN">తెలుగు</option><option value="en-US">English</option><option value="hi-IN">हिन्दी</option></select>
<select id="toLang"><option value="en-US">English</option><option value="te-IN">తెలుగు</option><option value="hi-IN">हिन्दी</option></select>
<button id="startTrans">🎤 Start Voice Translation</button>
<button id="stopTrans" style="background:#b45309">⏹️ Stop</button>
<div id="transText" style="margin-top:8px;font-size:13px;min-height:20px">Ready - Click Start and speak</div>
<div id="status"></div>
</div>

<div class="controls">
<button onclick="toggleMic()" id="micBtn">🎤</button>
<button onclick="toggleCam()" id="camBtn">📷</button>
<button onclick="copyLink()">🔗</button>
<button onclick="location.href='index.html'" class="end">📞</button>
</div>

<script>
const roomId = new URLSearchParams(location.search).get('room') || 'RATNA999';
document.getElementById('roomShow').innerText=roomId;
const myVideo=document.getElementById('myVideo');
const remoteVideo=document.getElementById('remoteVideo');
let localStream, peer, myPeerId = 'ar-'+roomId+'-'+Math.floor(Math.random()*1000);
let micOn=true, camOn=true;

async function init(){
 localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
 myVideo.srcObject=localStream;
 peer=new Peer(myPeerId);
 peer.on('open', id=>{
  document.getElementById('status').innerText='Ready: '+id+' - Share link to friend';
  // try connect to host
  setTimeout(()=>{ tryConnectHost(); }, 1000);
 });
 peer.on('call', call=>{
  call.answer(localStream);
  call.on('stream', s=>{
   remoteVideo.srcObject=s;
   document.getElementById('remoteLabel').innerText='Friend';
   document.getElementById('pCount').innerText='2';
  });
 });
 peer.on('error', e=>{ document.getElementById('status').innerText='Peer: '+e.type; });
}

function tryConnectHost(){
 // connect to all possible host IDs for this room
 for(let i=0;i<5;i++){
   let hostId='ar-'+roomId+'-'+i;
   if(hostId===myPeerId) continue;
   let call=peer.call(hostId, localStream);
   if(call){
    call.on('stream', s=>{
     remoteVideo.srcObject=s;
     document.getElementById('remoteLabel').innerText='Friend';
     document.getElementById('pCount').innerText='2';
    });
   }
 }
}

function toggleMic(){
 micOn=!micOn; localStream.getAudioTracks().forEach(t=>t.enabled=micOn);
 document.getElementById('micBtn').style.opacity=micOn?1:0.3;
}
function toggleCam(){
 camOn=!camOn; localStream.getVideoTracks().forEach(t=>t.enabled=camOn);
 document.getElementById('camBtn').style.opacity=camOn?1:0.3;
}
function copyLink(){
 let link=location.origin+location.pathname+'?room='+roomId;
 navigator.clipboard.writeText(link);
 document.getElementById('status').innerText='✅ Link copied: '+link;
 alert('Link copied! Send to friend: '+link);
}

// Translation
let rec;
document.getElementById('startTrans').onclick=()=>{
 const from=document.getElementById('fromLang').value;
 if(!('webkitSpeechRecognition' in window)){ alert('Chrome lo open chey'); return; }
 rec=new webkitSpeechRecognition(); rec.lang=from; rec.continuous=true; rec.interimResults=true;
 rec.onresult=e=>{
   let t=''; for(let i=e.resultIndex;i<e.results.length;i++) t+=e.results[i][0].transcript;
   document.getElementById('transText').innerText=t+' (translating...)';
   // simple - show same text as translation demo
   if(t.length>5){ document.getElementById('transText').innerText='🗣️ '+t; }
 };
 rec.start(); document.getElementById('transText').innerText='🎧 Listening... matladu';
};
document.getElementById('stopTrans').onclick=()=>{ if(rec) rec.stop(); document.getElementById('transText').innerText='Ready'; };

init();
</script>
</body>
</html>
