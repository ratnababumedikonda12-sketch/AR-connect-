let currentMeeting = new URLSearchParams(location.search).get("meeting") || "main";

let arLanguage = localStorage.getItem("arConnectLanguage") || "en";

function toggleLanguage(){
  const box=document.getElementById("languageBox");
  if(box){
    box.style.display =
      box.style.display === "none" ? "block" : "none";
  }
}

function setARLanguage(code){
  arLanguage=code;
  localStorage.setItem("arConnectLanguage",code);

  const select=document.getElementById("languageSelect");
  const label=document.getElementById("selectedLanguage");

  if(select){
    const name=select.options[select.selectedIndex].text;
    if(label) label.textContent="Selected: "+name;
  }

  console.log("🌐 AR Connect language:",code);
}

document.addEventListener("DOMContentLoaded",()=>{
  const select=document.getElementById("languageSelect");

  if(select){
    select.value=arLanguage;

    const label=document.getElementById("selectedLanguage");
    if(label){
      const option=select.options[select.selectedIndex];
      label.textContent="Selected: "+(option ? option.text : "English");
    }
  }
});



function updateParticipantCount(count){
  const el=document.getElementById("participantCount");
  if(el){
    const n=parseInt(count);
    el.textContent=Number.isFinite(n) && n > 0 ? n : 1;
  }
}

function toggleParticipants(){
  const panel=document.getElementById("participantPanel");
  if(panel){
    panel.style.display =
      panel.style.display === "none" ? "block" : "none";
  }
}

function addParticipantToList(id,name){
  const list=document.getElementById("participantList");
  if(!list || !id) return;

  const itemId="participant-"+id;

  if(document.getElementById(itemId)) return;

  const item=document.createElement("div");
  item.id=itemId;
  item.style.cssText=
    "padding:9px;border-radius:10px;background:#1e293b;margin-top:6px;";

  item.textContent="👤 "+(name || "Participant");

  list.appendChild(item);
}

function removeParticipantFromList(id){
  const item=document.getElementById("participant-"+id);
  if(item) item.remove();
}

</script>

      "
    >
      🚀 ENTER AR CONNECT

    <div id="passwordStatus"
         style="margin-top:12px;color:#94a3b8;min-height:20px;">
    </div>
  </div>
</div>

<script>
async function verifyMeetingPassword(){

  const input=document.getElementById("meetingPassword");
  const status=document.getElementById("passwordStatus");

  const meetingId =
    new URLSearchParams(location.search).get("meeting") || "main";

  // Creator password saved by index.html
  const savedPassword =
    sessionStorage.getItem("arMeetingPassword");

  // If creator just created this meeting, verify automatically
  const savedMeetingId =
    sessionStorage.getItem("arMeetingId");

  if(savedMeetingId === meetingId && savedPassword){

    status.textContent="🔓 Entering your private meeting...";
    status.style.color="#22c55e";

    try{

      const response=await fetch("/api/verify-meeting-password",{
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          meetingId,
          password:savedPassword
        })
      });

      const result=await response.json();

      if(result.success){

        sessionStorage.setItem(
          "arMeetingAccess:"+meetingId,
          "true"
        );

        const gate=document.getElementById("passwordGate");
        if(gate) gate.remove();

        console.log(
          "🔓 Creator access granted:",
          meetingId
        );

        return;
      }

    }catch(error){

      console.error(
        "🔴 Automatic password verification failed:",
        error
      );
    }
  }

  // Normal friend/manual password entry
  const password=input.value;

  if(!password){
    status.textContent="Enter the meeting password";
    status.style.color="#fbbf24";
    return;
  }

  status.textContent="Checking...";
  status.style.color="#94a3b8";

  try{

    const response=await fetch("/api/verify-meeting-password",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        meetingId,
        password
      })
    });

    const result=await response.json();

    if(result.success){

      sessionStorage.setItem(
        "arMeetingAccess:"+meetingId,
        "true"
      );

      const gate=document.getElementById("passwordGate");
      if(gate) gate.remove();

      console.log(
        "🔓 Meeting access granted:",
        meetingId
      );

    }else{

      status.textContent=
        result.message || "Wrong password";

      status.style.color="#f87171";
      input.value="";
      input.focus();
    }

  }catch(error){

    console.error(
      "🔴 Password verification error:",
      error
    );

    status.textContent=
      "Error: "+(error.message || "Server connection failed");

    status.style.color="#f87171";
  }
}

document.addEventListener("DOMContentLoaded",()=>{

  const meetingId =
    new URLSearchParams(location.search).get("meeting") || "main";

  const access=sessionStorage.getItem(
    "arMeetingAccess:"+meetingId
  );

  if(access==="true"){

    const gate=document.getElementById("passwordGate");

    if(gate) gate.remove();

  }else{

    // Creator: automatically verify saved password
    const savedMeetingId =
      sessionStorage.getItem("arMeetingId");

    const savedPassword =
      sessionStorage.getItem("arMeetingPassword");

    if(
      savedMeetingId === meetingId &&
      savedPassword
    ){

      setTimeout(()=>{
        verifyMeetingPassword();
      },100);
    }
  }
});

</script>

let calcExpression = "";

function toggleCalculator(){

function calcPress(value){
  calcExpression += value;
  const display=document.getElementById("calcDisplay");
  if(display) display.value=calcExpression;

  if(typeof socket !== "undefined" && currentMeeting){
    socket.emit("calculator-update", {
      meetingId: currentMeeting,
      expression: calcExpression
    });
  }
}

function calcClear(){
  calcExpression="";
  const display=document.getElementById("calcDisplay");
  if(display) display.value="";
}

function calcResult(){
  try{
    if(!/^[0-9+*/.() -]+$/.test(calcExpression)) throw new Error("Invalid");
    const result=Function('"use strict";return ('+calcExpression+')')();
    calcExpression=String(result);
    document.getElementById("calcDisplay").value=calcExpression;

    if(typeof socket !== "undefined" && currentMeeting){
      socket.emit("calculator-update", {
        meetingId: currentMeeting,
        expression: calcExpression,
        result: result
      });
    }
  }catch(e){
    calcExpression="";
    document.getElementById("calcDisplay").value="Error";
  }
}

function addVideo(id, stream, name){
  if(document.getElementById("tile-"+id)) return;

  const tile = document.createElement("div");
  tile.className = "tile";
  tile.id = "tile-"+id;

  const video = document.createElement("video");
  video.autoplay = true;
  video.playsInline = true;
    video.muted = (id === "local") ? true : remoteAudioMuted;
    video.volume = (id === "local") ? 0 : (remoteAudioMuted ? 0 : 1);
  video.srcObject = stream;

  video.onloadedmetadata = ()=>{
    video.play().then(()=>{
      console.log("▶️ REMOTE VIDEO PLAYING:", id);
    }).catch(err=>{
      console.error("❌ REMOTE VIDEO PLAY FAILED:", id, err);
    });
  };

  const label = document.createElement("div");
  label.className = "name";
  label.textContent = name || "Participant";

  tile.appendChild(video);
  tile.appendChild(label);

  document.getElementById("videos").appendChild(tile);
  remoteTiles.set(id,tile);
}

function removeVideo(id){
  const tile = document.getElementById("tile-"+id);
  if(tile) tile.remove();

  const pc = peerConnections.get(id);
  if(pc){
    pc.close();
    peerConnections.delete(id);
  }

  remoteTiles.delete(id);
}

<script>
document.getElementById("micBtn").addEventListener("click",()=>{
  const stream = (typeof arStream !== "undefined" && arStream)
    ? arStream
    : localStream;

  if(!stream){
    console.log("🎤 Mic stream not ready");
    return;
  }

  const track = stream.getAudioTracks()[0];

  if(!track){
    console.log("🎤 Audio track not found");
    return;
  }

  track.enabled = !track.enabled;

  const micBtn = document.getElementById("micBtn");

  if(track.enabled){
    micBtn.textContent = "🎤";
    micBtn.style.background = "";
    micBtn.style.color = "";
    micBtn.style.boxShadow = "";
    console.log("🎤 Microphone ON");
  }else{
    micBtn.textContent = "🔴";
    micBtn.style.background = "#ef4444";
    micBtn.style.color = "#ffffff";
    micBtn.style.boxShadow = "0 0 18px #ef4444";
    console.log("🔴 Microphone OFF");
  }
});

document.getElementById("camBtn").onclick=()=>{
  if(!localStream) return;

  const track=localStream.getVideoTracks()[0];
  if(!track) return;

  track.enabled=!track.enabled;
  document.getElementById("camBtn").textContent=
    track.enabled ? "📹" : "🚫";
};

document.getElementById("copyBtn").onclick=async()=>{
  const meetingLink =
    window.location.origin +
    "/meeting.html?meeting=" +
    encodeURIComponent(meetingId);

  try{
    await navigator.clipboard.writeText(meetingLink);
    setStatus("✅ Meeting link copied");
  }catch(e){
    prompt("Copy meeting link:",meetingLink);
  }
};

function leaveMeeting(){
  if(localStream){
    localStream.getTracks().forEach(t=>t.stop());
  }

  peerConnections.forEach(pc=>pc.close());

  socket.disconnect();

  location.href="/";
}

// ===== FRIEND CALL CLIENT =====
socket.on("friend-ready",(data)=>{
  if(!data || !data.friendId) return;
  console.log("✅ Friend registered:",data.friendId);
  setStatus("👤 Friend ID ready: "+data.friendId);
});

socket.on("friend-error",(data)=>{

});

socket.on("incoming-friend-call",(data)=>{

  if(!data || !data.friendId) return;

  const accept = confirm(
    "📞 Incoming friend call\n\nFriend ID: "+data.friendId+"\n\nAccept?"

  if(accept){
    setStatus("📞 Friend call accepted");
    socket.emit("friend-call-accepted",{
      friendId:data.friendId,
      callerSocketId:data.from
    });
  }else{
    setStatus("❌ Friend call declined");
  }
});

  if(!data || !data.from) return;

  console.log("✅ Friend accepted:",data.from);
  setStatus("📞 Friend accepted — PeerJS connecting...");
});

<!-- AR CONNECT PEERJS ENGINE -->
<script>
let arPeer = null;
let arStream = null;
let arCalls = {};

async function startARPeerEngine(){

  try{
    console.log("🚀 AR PeerJS engine starting...");
    setStatus("🎥 Camera + Mic start అవుతోంది...");

    arStream = await navigator.mediaDevices.getUserMedia({
      video:{
        width:{ideal:1280,max:1920},
        height:{ideal:720,max:1080},
        frameRate:{ideal:30,max:30},
        facingMode:"user"
      },
      audio:{
        echoCancellation:true,
        noiseSuppression:true,
        autoGainControl:true,
        channelCount:1
      }
    });

    console.log("🎥 AR V4 camera + microphone ready");
    setStatus("🎥 Camera + Mic ready — PeerJS connecting...");

    // Use PeerJS media stream as the main local stream
    localStream = arStream;

    if(typeof addVideo === "function"){
      addVideo("local", arStream, "You");
    }

    arPeer = new Peer();

    arPeer.on("open", id=>{
      console.log("🆔 AR Peer ready:",id);
      setStatus("✅ AR Connect connected");
      window.arPeerId = id;

      // First join the Socket.IO meeting room
      socket.emit("join-room",{
        meetingId: currentMeeting,
        userId: socket.id
      });

      // Then register the PeerJS ID
      socket.emit("register-peer", {
        meetingId: currentMeeting,
        peerId: id
      });

      console.log("📡 Joined meeting + registered Peer:", meetingId, id);
    });

    // Existing participants: call them after PeerJS is ready
    async function callARPeer(peerId){
      if(!peerId || peerId === window.arPeerId) return;
      if(arCalls[peerId]) return;

      // Wait briefly for PeerJS + local media to become ready
      for(let i=0;i<30;i++){
        if(arPeer && arStream) break;
        await new Promise(r=>setTimeout(r,200));
      }

      if(!arPeer){
        console.error("❌ PeerJS not ready:", peerId);
        return;
      }

      if(!arStream){
        console.error("❌ Local media not ready:", peerId);
        return;
      }

      console.log("📞 AR CALLING PEER:", peerId);

      const call = arPeer.call(peerId, arStream);

      if(!call){
        console.error("❌ PeerJS call could not start:", peerId);
        return;
      }

      arCalls[peerId] = call;

      call.on("stream", remoteStream=>{
        console.log("🎥 REMOTE STREAM:", peerId);
        showARRemote(peerId, remoteStream);
      });

      call.on("close", ()=>{
        console.log("📴 AR call closed:", peerId);
        delete arCalls[peerId];
      });

      call.on("error", err=>{
        console.error("❌ AR call error:", peerId, err);
        delete arCalls[peerId];
      });
    }

    socket.on("new-peer", data=>{
      const peerId = data?.peerId;
      console.log("🆕 New AR peer:", peerId);

      if(peerId){
        setTimeout(()=>{
          callARPeer(peerId);
        }, 300);
      }
    });

    socket.on("existing-peers", peerIds=>{
      console.log("👥 Existing AR peers:", peerIds);

      (peerIds || []).forEach(peerId=>{
        callARPeer(peerId);
      });
    });

    arPeer.on("error", error=>{
      console.error("❌ PeerJS error:",error);
    });

    arPeer.on("call", call=>{
      console.log("📞 Incoming AR call:",call.peer);

      call.answer(arStream);

      call.on("stream", remoteStream=>{
        console.log("🎥 REMOTE STREAM:",call.peer);
        showARRemote(call.peer,remoteStream);
      });

      arCalls[call.peer]=call;
    });

  }catch(error){
    console.error("❌ AR Peer engine:",error);
  }
}

function showARRemote(peerId,stream){

  const videosBox = document.getElementById("videos");
  if(!videosBox){
    console.error("❌ Main #videos container not found");
    return;
  }

  let tile = document.getElementById("ar-tile-"+peerId);
  let video;

  if(!tile){
    tile=document.createElement("div");
    tile.id="ar-tile-"+peerId;
    tile.className="video-tile";

    video=document.createElement("video");
    video.id="ar-remote-"+peerId;
    video.autoplay=true;
    video.playsInline=true;
    video.controls=false;
    video.muted=false;
    video.volume=1;

    const label=document.createElement("div");
    label.className="name";
    label.textContent="Participant";

    tile.appendChild(video);
    tile.appendChild(label);

    videosBox.appendChild(tile);
  }else{
    video=tile.querySelector("video");
  }

  if(!video) return;

  video.srcObject=stream;
  video.muted=remoteAudioMuted;
  video.volume=remoteAudioMuted ? 0 : 1;

  video.onloadedmetadata=()=>{
    video.play().then(()=>{
      console.log("▶️ REMOTE VIDEO PLAYING:",peerId);
    }).catch(error=>{
      console.log("🔊 Remote autoplay waiting:",error);
    });
  };

  console.log("✅ Remote video placed in main grid:",peerId);
}
window.startARPeerEngine=startARPeerEngine;

window.addEventListener("load",()=>{
  setTimeout(()=>{
    startARPeerEngine();
  },1000);
});
</script>
