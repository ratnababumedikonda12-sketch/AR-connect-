<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AR Connect - Live</title>
<style>body{margin:0;background:#000;height:100vh;overflow:hidden;font-family:Arial}#top{position:fixed;top:0;left:0;right:0;background:#0a84ff;color:#fff;padding:8px 12px;display:flex;justify-content:space-between;z-index:10;font-size:14px}#jitsi{width:100vw;height:100vh;border:none;margin-top:38px;background:#000}</style></head><body>
<div id="top"><div>🚀 AR Connect - <span id="room"></span> | ✅ Camera ON</div><div><button onclick="navigator.clipboard.writeText(location.href);alert('Link Copied! Share with friend')" style="background:#fff;border:none;color:#0a84ff;padding:4px 12px;border-radius:6px;font-weight:bold">Copy Link</button></div></div>
<div id="jitsi"></div>
<script src="https://meet.ffmuc.net/external_api.js"></script>
<script>
const roomId=new URLSearchParams(location.search).get('room')||new URLSearchParams(location.search).get('meeting')||'RATNA99';
document.getElementById('room').textContent=roomId;
const api=new JitsiMeetExternalAPI("meet.ffmuc.net",{
 roomName:"ARConnect_"+roomId,
 width:"100%",height:window.innerHeight-38,
 parentNode:document.querySelector('#jitsi'),
 configOverwrite:{prejoinPageEnabled:false,startWithAudioMuted:false,startWithVideoMuted:false},
 interfaceConfigOverwrite:{SHOW_JITSI_WATERMARK:false,TOOLBAR_BUTTONS:['microphone','camera','desktop','chat','hangup','tileview']},
 userInfo:{displayName:"Ratna"}
});
</script></body></html>
